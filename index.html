<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kayak Fishing Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e0f7fa; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        h1 { text-align: center; }
        #mapSection { height: 200px; background: #b2ebf2; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border-radius: 4px; }
        .section { margin-bottom: 20px; }
        .label { font-weight: bold; }
        .result { margin-top: 5px; }
        svg { width: 50px; height: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kayak Fishing Assistant</h1>

        <div class="section">
            <label class="label">Date:</label>
            <input type="date" id="dateInput">
            <button onclick="getInfo()">Get Fishing Info</button>
        </div>

        <div id="mapSection" class="section">
            <div id="locationText">Locating...</div>
        </div>

        <div class="section">
            <div class="label">Weather:</div>
            <div id="weather" class="result"></div>
        </div>

        <div class="section">
            <div class="label">Best Fishing Times:</div>
            <div id="times" class="result"></div>
        </div>

        <div class="section">
            <div class="label">Recommended Baits:</div>
            <div id="baits" class="result"></div>
        </div>
    </div>

<script>
function getInfo() {
    const dateInput = document.getElementById('dateInput');
    const date = dateInput.value ? new Date(dateInput.value) : new Date();

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            document.getElementById('locationText').textContent = `Lat: ${lat.toFixed(3)}, Lon: ${lon.toFixed(3)}`;
            fetchWeather(lat, lon);
            computeBestTimes(lat, lon, date);
            showBaits(date);
        }, err => {
            document.getElementById('locationText').textContent = 'Unable to get location';
            computeBestTimes(0,0,date); // use default
            showBaits(date);
        });
    } else {
        document.getElementById('locationText').textContent = 'Geolocation not supported';
        computeBestTimes(0,0,date); // use default
        showBaits(date);
    }
}

function fetchWeather(lat, lon) {
    const weatherDiv = document.getElementById('weather');
    const apiKey = 'YOUR_API_KEY'; // OpenWeatherMap API key
    const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;
    weatherDiv.textContent = 'Loading weather...';
    fetch(url)
        .then(resp => resp.ok ? resp.json() : Promise.reject('weather fetch failed'))
        .then(data => {
            const temp = data.main.temp;
            const description = data.weather[0].description;
            const icon = data.weather[0].icon;
            const img = document.createElement('img');
            img.alt = description;
            img.src = `https://openweathermap.org/img/wn/${icon}@2x.png`;
            weatherDiv.innerHTML = '';
            weatherDiv.appendChild(img);
            const span = document.createElement('span');
            span.textContent = `${temp} °C, ${description}`;
            weatherDiv.appendChild(span);
        })
        .catch(err => {
            weatherDiv.textContent = 'Weather unavailable (check API key or network).';
        });
}

function computeBestTimes(lat, lon, date) {
    const timesDiv = document.getElementById('times');
    const sun = getSunTimes(lat, lon, date);
    if (!sun.sunrise || !sun.sunset) {
        timesDiv.textContent = 'Unable to compute sunrise/sunset for this location.';
        return;
    }
    const bestMorning = new Date(sun.sunrise.getTime() + 60*60*1000); // 1h after sunrise
    const bestEvening = new Date(sun.sunset.getTime() - 60*60*1000); // 1h before sunset
    timesDiv.textContent = `Morning: ${bestMorning.toLocaleTimeString()}, Evening: ${bestEvening.toLocaleTimeString()}`;
}

function getSunTimes(lat, lon, date) {
    const rad = Math.PI / 180;
    const J1970 = 2440587.5;
    const J2000 = 2451545;
    const toJulian = d => d / 86400000 + J1970;
    const fromJulian = j => new Date((j - J1970) * 86400000);
    const d = toJulian(date) - J2000;
    const n = Math.round(d - lon/360);
    const Jstar = J2000 + n + lon/360;
    const M = (357.5291 + 0.98560028 * (Jstar - J2000)) % 360;
    const C = 1.9148 * Math.sin(M*rad) + 0.02*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
    const lambda = (M + C + 180 + 102.9372) % 360;
    const Jtransit = Jstar + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*lambda*rad);
    const decl = Math.asin(Math.sin(lambda*rad) * Math.sin(23.44*rad));
    const cosOmega = (Math.sin(-0.83*rad) - Math.sin(lat*rad)*Math.sin(decl)) / (Math.cos(lat*rad)*Math.cos(decl));
    if (cosOmega > 1 || cosOmega < -1) return {sunrise: null, sunset: null};
    const omega = Math.acos(cosOmega);
    const Jrise = Jtransit - omega/(2*Math.PI);
    const Jset = Jtransit + omega/(2*Math.PI);
    return {sunrise: fromJulian(Jrise), sunset: fromJulian(Jset)};
}

function showBaits(date) {
    const baitsDiv = document.getElementById('baits');
    const month = date.getMonth() + 1;
    let baits;
    if (month >= 5 && month <= 9) {
        baits = ['Topwater lures', 'Spinnerbaits', 'Soft plastics'];
    } else {
        baits = ['Jigs', 'Live baits', 'Crankbaits'];
    }
    baitsDiv.textContent = baits.join(', ');
}
</script>
</body>
</html>
